name: moe_flutter_payment
description: Payment gateway integration for MOE Flutter ecosystem — payment processing, transactions.
version: 1.0.0
repository: https://github.com/mindofemanizer/MOE-Flutter-Payment

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  moe_flutter_core:
